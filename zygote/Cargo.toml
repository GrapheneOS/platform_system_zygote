[package]
name = "zygote"
version = "0.1.0"
edition = "2024"

[features]
default = ["libapp", "test"]
android-native = []
libapp = []
mock = []
test = ["mock"]

[dependencies]
anyhow = "1.0.97"
arrayvec = "0.7.6"
cap = { path = "../../../external/libcap/libcap/rust" }
clap = { version = "4.5.0", features = ["derive"] }
flatbuffers = "25.1.24"
itertools = "0.14.0"
libc = "0.2.171"
libloading = "0.8.6"
log = { version = "0.4", features = ["std"] }
logger = { path = "../../logging/rust" }
zerocopy = "0.8.21"
zygote-sys = { path = "../zygote-sys" }
zygote_proc_macros = { path = "../zygote-proc-macros" }

[build-dependencies]
which = "7.0.3"

[dev-dependencies]
libtest-mimic = "0.8.1"
rustix = { version = "0.38.31", features = [
    "alloc",
    "event",
    "fs",
    "libc",
    "libc_errno",
    "mm",
    "std",
    "use-libc",
    "use-libc-auxv",
] }
which = "7.0.3"
tempfile = "3"
memmark = { path = "../memmark" }

[[test]]
name = "file_descriptor_tests_no_panic"
path = "tests/file_descriptors/calm.rs"
test = true
bench = false
doc = false
harness = false
required-features = ["test"]
